<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Салбар сонгох</title>
<link rel="stylesheet" href="../assets/css/payment.css">
</head>
<body>
<header>
    
     <a class="logo" href="#">
        <span class="logo-icon">π</span>
        <span class="logo-name">Пи тоо</span>
    </a>
    <nav aria-label="Үндсэн цэс">
        <a href="../index.html">Нүүр</a>
        <a href="teachers.html">Багш нар</a>
    </nav>
    <div>
        <a href="student-login.html">Нэвтрэх</a>
        <a href="register.html" class="btn">Бүртгүүлэх</a>
    </div>
</header>
<main class="container">

    <!-- STEPS -->

    <section class="steps">

        <div class="step done-step">
            <div class="circle done">✓</div>
            <span>Салбар</span>
        </div>

        <div class="line active-line"></div>

        <div class="step done-step">
            <div class="circle done">✓</div>
            <span>Анкет</span>
        </div>

        
        <div class="line active-line"></div>

        <div class="step active-step">
            <div class="circle active">3</div>
            <span>Төлбөр</span>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle"><a href="payment-success.html">4</a></div>
            <span>Дууссан</span>
        </div>

    </section>

    <!-- TITLE -->

    <section class="title">
        <h1>QPay төлбөр</h1>
        <p>QR кодыг уншуулж төлбөрөө төлнө үү</p>
    </section>

    <!-- PAYMENT -->

    <section class="payment-grid">

        <!-- LEFT CARD -->

        <div class="payment-card">

            <h2>Захиалгын дэлгэрэнгүй</h2>

            <div class="info-row">
                <span>Багш</span>
                <strong>С. Цэцэгмаа</strong>
            </div>

            <div class="info-row">
                <span>Хичээл</span>
                <strong>Биологи</strong>
            </div>

            <div class="info-row">
                <span>Багц</span>
                <strong>75 цаг</strong>
            </div>

            <div class="info-row">
                <span>Хичээлийн тоо</span>
                <strong>25 хичээл × 3 цаг</strong>
            </div>

            <hr>

            <div class="total-row">
                <span>Нийт дүн</span>
                <strong>370,000₮</strong>
            </div>

        </div>

        <!-- RIGHT CARD -->

        <div class="payment-card qr-card">

            <h2>QPay</h2>

            <div class="qr-box">
                QR
            </div>

            <p>QPay аппликейшнээр QR кодыг уншуулна уу</p>

            <button>Төлбөр шалгах</button>

        </div>
        <article>
    </section>
    <nav class="actions" aria-label="Алхам удирдлага">
        <button class="prev" type="button"><a href="register.html">Өмнөх</a></button>
        <button class="next" type="button"><a href="payment-success.html">Дараах</a></button>
    </nav>
</main>
</body>
</html>
