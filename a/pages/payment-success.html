<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бүртгэл амжилттай</title>

    <link rel="stylesheet" href="../assets/css/payment-success.css">
</head>

<body>

<header>

    <a class="logo" href="#">
        <span class="logo-icon">π</span>
        <span class="logo-name">Пи тоо</span>
    </a>

    <nav aria-label="Үндсэн цэс">
        <a href="../index.html">Нүүр</a>
        <a href="teachers.html">Багш нар</a>
    </nav>

    <div class="header-right">
        <a href="student-login.html">Нэвтрэх</a>
        <a href="register.html" class="btn">Бүртгүүлэх</a>
    </div>

</header>

<main class="container">

    <!-- STEPS -->

    <nav class="steps" aria-label="Бүртгэлийн алхмууд">

        <div class="step done-step">
            <div class="circle done"><svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' viewBox='0 0 24 24' style='vertical-align:-.15em;flex:none' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='ico'><path d='M20 6 9 17l-5-5'/></svg></div>
            <span>Салбар</span>
        </div>

        <div class="line active-line"></div>

        <div class="step done-step">
            <div class="circle done"><svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' viewBox='0 0 24 24' style='vertical-align:-.15em;flex:none' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='ico'><path d='M20 6 9 17l-5-5'/></svg></div>
            <span>Анкет</span>
        </div>

        <div class="line active-line"></div>

        <div class="step done-step">
            <div class="circle done"><svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' viewBox='0 0 24 24' style='vertical-align:-.15em;flex:none' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='ico'><path d='M20 6 9 17l-5-5'/></svg></div>
            <span>Багш</span>
        </div>

        <div class="line active-line"></div>

        <div class="step done-step">
            <div class="circle done"><svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' viewBox='0 0 24 24' style='vertical-align:-.15em;flex:none' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='ico'><path d='M20 6 9 17l-5-5'/></svg></div>
            <span>Хуваарь</span>
        </div>

        <div class="line active-line"></div>

        <div class="step done-step">
            <div class="circle done"><svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' viewBox='0 0 24 24' style='vertical-align:-.15em;flex:none' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='ico'><path d='M20 6 9 17l-5-5'/></svg></div>
            <span>Төлбөр</span>
        </div>

        <div class="line active-line"></div>

        <div class="step active-step">
            <div class="circle active">6</div>
            <span>Дууссан</span>
        </div>

    </nav>

    <!-- SUCCESS -->

    <section class="success-section">

        <div class="success-icon">

            <img src="../assets/svg/check.svg"
                 alt="success"
                 class="check-icon">

        </div>

        <h1>Амжилттай!</h1>

        <p>
            Таны бүртгэл амжилттай хийгдлээ.
            Доорх мэдээллийг шалгана уу.
        </p>

    </section>

    <!-- CARDS -->

    <div class="cards-wrapper">

        <!-- INFO CARD -->

        <section class="info-card">

            <!-- TEACHER -->

            <div class="info-item">

                <div class="icon">

                    <img src="../assets/svg/teacher.svg"
                         alt="teacher"
                         class="small-icon">

                </div>

                <div class="info-content">

                    <span>Багш</span>

                    <strong id="success-teacher">—</strong>

                </div>

            </div>

            <!-- SCHEDULE -->

            <div class="info-item">

                <div class="icon">

                    <img src="../assets/svg/calendar.svg"
                         alt="calendar"
                         class="small-icon">

                </div>

                <div class="info-content">

                    <span>Хуваарь</span>

                    <strong id="success-schedule">
                        —
                    </strong>

                </div>

            </div>

            <!-- PROGRAM -->

            <div class="info-item">

                <div class="icon">

                    <img src="../assets/svg/location.svg"
                         alt="location"
                         class="small-icon">

                </div>

                <div class="info-content">

                    <span>Хөтөлбөр</span>

                    <strong id="success-program">—</strong>

                </div>

            </div>

        </section>

        <!-- QR CARD -->

        <section class="qr-card">

            <h3>Ирцийн QR код</h3>

            <div class="qr-box">
                QR
            </div>

            <p>
                Хичээл ирэхдээ энэ QR кодыг уншуулна уу
            </p>

        </section>

    </div>

    <!-- BUTTON -->

    <div class="actions">

        <button id="go-dashboard-btn">
            Миний хуудас руу орох
        </button>

    </div>

</main>

<script type="module" src="../assets/js/pages/payment-success.js"></script>
</body>

</html>
