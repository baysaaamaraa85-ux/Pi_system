<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Төлбөр амжилттай</title>
    <link rel="stylesheet" href="../assets/css/payment-success.css">
</head>

<body>
<main class="success" role="main" aria-labelledby="success-title">

    <!-- Header хэсэг -->
    <header class="success__header">
        <div class="success__icon" aria-hidden="true">✓</div>
        <h1 id="success-title">Төлбөр амжилттай</h1>
        <p class="success__subtitle">Таны төлбөр амжилттай бүртгэгдлээ.</p>
    </header>

    <!-- Detail card -->
    <section class="success__card" aria-label="Төлбөрийн дэлгэрэнгүй мэдээлэл">

        <div class="success__row">
            <span class="success__label">👩‍🏫 Багш:</span>
            <span class="success__value">С. Цэцэгмаа</span>
        </div>

        <div class="success__divider"></div>

        <div class="success__row">
            <span class="success__label">📘 Хичээл:</span>
            <span class="success__value">Биологи</span>
        </div>

        <div class="success__divider"></div>

        <div class="success__row">
            <span class="success__label">💰 Дүн:</span>
            <span class="success__value">450,000₮</span>
        </div>

        <div class="success__divider"></div>

        <div class="success__row">
            <span class="success__label">📍 Салбар:</span>
            <span class="success__value">Хан-Уул</span>
        </div>

    </section>

    <!-- Action -->
    <footer class="success__footer">
        <a href="../index.html" class="success__btn" role="button">
            Нүүр хуудас руу буцах
        </a>
    </footer>

</main>
</body>
</html>
