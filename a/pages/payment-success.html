<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бүртгэл амжилттай</title>

    <link rel="stylesheet" href="../assets/css/payment-success.css">
</head>

<body>

<header>

    <a class="logo" href="#">
        <span class="logo-icon">π</span>
        <span class="logo-name">Пи тоо</span>
    </a>

    <nav aria-label="Үндсэн цэс">
        <a href="../index.html">Нүүр</a>
        <a href="teachers.html">Багш нар</a>
    </nav>

    <div class="header-right">
        <a href="student-login.html">Нэвтрэх</a>
        <a href="register.html" class="btn">Бүртгүүлэх</a>
    </div>

</header>

<main class="container">

    <!-- STEPS -->

    <nav class="steps" aria-label="Бүртгэлийн алхмууд">

        <div class="step active-step">
            <div class="circle active">1</div>
            <span>Салбар</span>
        </div>

        <div class="line active-line"></div>

        <div class="step active-step">
            <div class="circle active">2</div>
            <span>Анкет</span>
        </div>

        <div class="line active-line"></div>

        <div class="step active-step">
            <div class="circle active">3</div>
            <span>Төлбөр</span>
        </div>

        <div class="line active-line"></div>

        <div class="step active-step">
            <div class="circle active">4</div>
            <span>Дууссан</span>
        </div>

    </nav>

    <!-- SUCCESS -->

    <section class="success-section">

        <div class="success-icon">

            <img src="../assets/svg/check.svg"
                 alt="success"
                 class="check-icon">

        </div>

        <h1>Амжилттай!</h1>

        <p>
            Таны бүртгэл амжилттай хийгдлээ.
            Доорх мэдээллийг шалгана уу.
        </p>

    </section>

    <!-- CARDS -->

    <div class="cards-wrapper">

        <!-- INFO CARD -->

        <section class="info-card">

            <!-- TEACHER -->

            <div class="info-item">

                <div class="icon">

                    <img src="../assets/svg/teacher.svg"
                         alt="teacher"
                         class="small-icon">

                </div>

                <div class="info-content">

                    <span>Багш</span>

                    <strong>Б. Батбаяр</strong>

                </div>

            </div>

            <!-- SCHEDULE -->

            <div class="info-item">

                <div class="icon">

                    <img src="../assets/svg/calendar.svg"
                         alt="calendar"
                         class="small-icon">

                </div>

                <div class="info-content">

                    <span>Хуваарь</span>

                    <strong>
                        Даваа, Лхагва, Баасан | 08:00–11:00
                    </strong>

                </div>

            </div>

            <!-- LOCATION -->

            <div class="info-item">

                <div class="icon">

                    <img src="../assets/svg/location.svg"
                         alt="location"
                         class="small-icon">

                </div>

                <div class="info-content">

                    <span>Салбар</span>

                    <strong>УБ Төв</strong>

                </div>

            </div>

        </section>

        <!-- QR CARD -->

        <section class="qr-card">

            <h3>Ирцийн QR код</h3>

            <div class="qr-box">
                QR
            </div>

            <p>
                Хичээл ирэхдээ энэ QR кодыг уншуулна уу
            </p>

        </section>

    </div>

    <!-- BUTTON -->

    <div class="actions">

        <button>
            Миний хуудас руу орох
        </button>

    </div>

</main>

</body>

</html>
