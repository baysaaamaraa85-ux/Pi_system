<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэвтрэх | Пи тоо</title>
    <link rel="stylesheet" href="../assets/css/student-login.css">
</head>
<body>

<!-- ДЭЭД БАР -->
<header class="top-bar">
    <a class="top-bar__brand" href="../index.html">
        <span class="top-bar__icon">π</span>
        <span class="top-bar__name">Пи тоо</span>
    </a>
    <a class="top-bar__back" href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ico"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Нүүр хуудас
    </a>
</header>

<!-- НЭВТРЭХ ФОРМ -->
<main class="auth-form-col">
    <div class="auth-form">

        <p class="login-eyebrow">Пи тоо систем</p>
        <h2 class="login-title">Нэвтрэх</h2>
        <p class="login-sub">Үргэлжлүүлэхийн тулд мэдээллээ оруулна уу</p>

        <article class="login-card">

            <!-- Хэрэглэгчийн төрөл -->
            <div class="form-group">
                <label>Хэрэглэгчийн төрөл</label>
                <div class="role-toggle" id="role-toggle">
                    <button type="button" class="role-chip is-active" data-role="Сурагч">Сурагч</button>
                    <button type="button" class="role-chip" data-role="Багш">Багш</button>
                    <button type="button" class="role-chip" data-role="Эцэг эх">Эцэг эх</button>
                </div>
                <input type="hidden" id="user-type" value="Сурагч">
            </div>

            <!-- И-мэйл -->
            <div class="form-group">
                <label for="email">И-мэйл</label>
                <input type="email" id="email" class="form-input" placeholder="user@example.com" autocomplete="email">
            </div>

            <!-- Нууц үг -->
            <div class="form-group">
                <div class="form-group__row">
                    <label for="password">Нууц үг</label>
                    <a class="form-group__link" href="#">Нууц үг мартсан?</a>
                </div>
                <div class="input-wrap">
                    <input type="password" id="password" class="form-input" placeholder="Нууц үг оруулах" autocomplete="current-password">
                    <button class="eye-btn" onclick="togglePass()" type="button" aria-label="Нууц үг харах"><svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='ico'><path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/></svg></button>
                </div>
            </div>

            <button id="loginBtn" class="login-btn">Нэвтрэх</button>

            <p class="login-footer">
                Бүртгэлгүй бол <a href="branch-select.html" id="register-link">энд дарж бүртгүүлнэ үү</a>
            </p>

        </article>

        <p class="login-demo"><span>Демо: дурын мэдээлэл оруулж нэвтрэх боломжтой</span></p>

    </div>
</main>

<script type="module" src="../assets/js/pages/login.js"></script>

</body>
</html>
