<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Салбар сонгох</title>

    <link rel="stylesheet" href="../assets/css/branch-select.css">
</head>

<body>

    <header>

        <a class="logo" href="#">
            <span class="logo-icon">π</span>
            <span class="logo-name">Пи тоо</span>
        </a>

        <nav aria-label="Үндсэн цэс">
            <a href="../index.html">Нүүр</a>
            <a href="teachers.html">Багш нар</a>
        </nav>

        <div class="header-right">
            <a href="student-login.html">Нэвтрэх</a>
            <a href="register.html" class="btn">Бүртгүүлэх</a>
        </div>

    </header>

    <main class="container">

        <!-- STEPS -->

        <nav class="steps" aria-label="Бүртгэлийн алхмууд">

            <div class="step">
                <div class="circle active">1</div>
                <span>Салбар</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">
                    <a href="register.html">2</a>
                </div>
                <span>Анкет</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">3</div>
                <span>Багш</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">4</div>
                <span>Хуваарь</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">5</div>
                <span>Төлбөр</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">6</div>
                <span>Дууссан</span>
            </div>

        </nav>

        <!-- TITLE -->

        <section class="title">

            <h1>Салбар сонгох</h1>

            <p>
                Өөрт ойрхон салбараа сонгоно уу
            </p>

        </section>

        <!-- GRID -->

        <section class="grid" aria-label="Салбарууд">

            <pi-card
                title="УБ Төв"
                location="Сүхбаатар дүүрэг, 1-р хороо"
                time="08:00 - 21:00"
                phone="7711-1234">
            </pi-card>

            <pi-card
                title="Хан-Уул"
                location="Зайсан"
                time="08:00 - 20:00"
                phone="7711-3456">
            </pi-card>

            <pi-card
                title="Баянзүрх"
                location="13-р хороолол"
                time="08:00 - 20:00"
                phone="7711-5678">
            </pi-card>

            <pi-card
                title="Сүхбаатар"
                location="1-р хороо"
                time="08:00 - 20:00"
                phone="7711-9999">
            </pi-card>

        </section>

        <nav class="actions" aria-label="Алхам удирдлага">
            <button class="next" type="button">
                <a href="register.html">Дараах</a>
            </button>
        </nav>

    </main>

<script src="../wc/pi-card.js"></script>
<script type="module" src="../assets/js/pages/branch-select.js"></script>

</body>

</html>
