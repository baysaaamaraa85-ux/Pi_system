<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сурагчийн хянах самбар | Пи тоо</title>
<link rel="stylesheet" href="../assets/css/student-dashboard.css?v=3">
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="../index.html">
    <span class="topbar__icon">π</span>
    <span class="topbar__title">Сурагчийн булан</span>
  </a>
  <button class="topbar__avatar" id="profile-btn" type="button" title="Гарах">А</button>
</header>

<main class="dash">

  <section class="dash-head">
    <h1 id="greeting">Сайн байна уу!</h1>
    <p>Таны сургалтын дэлгэрэнгүй мэдээлэл</p>
  </section>

  <section class="dash-grid dash-grid--3">

    <!-- Явц -->
    <article class="card card--center">
      <div class="ring">
        <svg viewBox="0 0 160 160">
          <circle class="ring__track" cx="80" cy="80" r="68"></circle>
          <circle class="ring__fill" id="progress-ring" cx="80" cy="80" r="68"></circle>
        </svg>
        <div class="ring__label">
          <strong id="ring-completed">45</strong>
          <span id="ring-total">/ 75 цаг</span>
        </div>
      </div>
      <h2>75 цагийн явц</h2>
      <p class="muted" id="progress-remaining">Үлдсэн: 30 цаг (10 хичээл)</p>
    </article>

    <!-- Дараагийн хичээл -->
    <article class="card">
      <div class="card__head">
        <span class="head-icon" data-icon="calendar"></span>
        <h2>Дараагийн хичээл</h2>
      </div>
      <div id="next-lesson">
        <div class="lesson-box">
          <strong>—</strong>
          <span>Ачаалж байна…</span>
        </div>
      </div>
    </article>

    <!-- QR ирц -->
    <article class="card card--qr card--center">
      <span class="qr-mark" data-icon="qr"></span>
      <button class="btn" id="qr-btn" type="button">QR ирцийн код</button>
      <p class="muted">Хичээлд ирэхдээ энэ товчийг дарна уу</p>
    </article>

  </section>

  <section class="dash-grid dash-grid--2">

    <!-- Чөлөөний үлдэгдэл -->
    <article class="card">
      <div class="card__head">
        <span class="head-icon" data-icon="edit"></span>
        <h2>Чөлөөний үлдэгдэл</h2>
        <span class="pill" id="leave-badge">3/5 үлдсэн</span>
      </div>
      <div class="progress-bar"><span id="leave-bar" style="width:40%"></span></div>
      <p class="muted" id="leave-text">5 удаагийн чөлөөнөөс 2 удаа ашигласан</p>
      <button class="btn btn--ghost" id="leave-btn" type="button">Чөлөө авах хүсэлт</button>
    </article>

    <!-- Ирцийн түүх -->
    <article class="card">
      <div class="card__head">
        <span class="head-icon" data-icon="clock"></span>
        <h2>Ирцийн түүх</h2>
      </div>
      <div class="log" id="attendance-list">
        <p class="muted">Ачаалж байна…</p>
      </div>
    </article>

  </section>

</main>

<script type="module" src="../assets/js/pages/student-dashboard.js?v=3"></script>
</body>
</html>
