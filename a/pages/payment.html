<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR төлбөр</title>
<link rel="stylesheet" href="../assets/css/payment.css">
</head>
<body>
<header>
    <div class="logo">Pi ИнСпирэйшн</div>
    <nav aria-label="Үндсэн цэс">
        <a href="../index.html">Нүүр</a>
        <a href="teachers.html">Багш нар</a>
    </nav>
    <div>
        <a href="student-login.html">Нэвтрэх</a>
        <a href="register.html" class="btn">Бүртгүүлэх</a>
    </div>
</header>
<main class="container">

    <div class="steps">
        <div class="circle"><a href="branch-select.html">1</a></div>
        <div class="line"></div>
        <div class="circle"><a href="register.html">2</a></div>
        <div class="line"></div>
        <div class="circle"><a href="level-test.html">3</a></div>
        <div class="line"></div>
        <div class="circle"><a href="teacher-select.html">4</a></div>
        <div class="line"></div>
        <div class="circle active "><a href="payment.html">5</a></div>
    </div>
    <section class="title">
        <h1>QPay төлбөр</h1>
        <p>QR кодыг уншуулж төлбөрөө төлнө үү</p>
    </section>
    <section class="grid" aria-label="Төлбөрийн мэдээлэл">
        <article class="card">
            <h3>Захиалгын дэлгэрэнгүй</h3>
            <div class="row"><span>Багш</span><span>С. Цэцэгмаа</span></div>
            <div class="row"><span>Хичээл</span><span>Биологи</span></div>
            <div class="row"><span>Багц</span><span>75 цаг</span></div>
            <div class="row"><span>Хичээлийн тоо</span><span>25</span></div>
            <div class="row total"><span>Нийт дүн</span><span>450,000₮</span></div>
        </article>
        <article class="card">
            <h3>QR код</h3>
            <div class="qr-box">⌁</div>
            <a class="pay-btn" href="payment-success.html">Төлбөр шалгах</a>
        </article>
    </section>
    <nav aria-label="Төлбөрийн удирдлага">
        <button class="prev" type="button"><a href="teacher-select.html">Өмнөх</a></button>
    </nav>
</main>
</body>
</html>
