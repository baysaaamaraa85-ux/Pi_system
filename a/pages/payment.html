<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Төлбөр</title>
<link rel="stylesheet" href="../assets/css/payment.css">
</head>
<body>
<header>

     <a class="logo" href="#">
        <span class="logo-icon">π</span>
        <span class="logo-name">Пи тоо</span>
    </a>
    <nav aria-label="Үндсэн цэс">
        <a href="../index.html">Нүүр</a>
        <a href="teachers.html">Багш нар</a>
    </nav>
    <div>
        <a href="student-login.html">Нэвтрэх</a>
        <a href="register.html" class="btn">Бүртгүүлэх</a>
    </div>
</header>
<main class="container">

    <!-- STEPS -->

    <section class="steps">

        <div class="step done-step">
            <div class="circle done">✓</div>
            <span>Салбар</span>
        </div>

        <div class="line active-line"></div>

        <div class="step done-step">
            <div class="circle done">✓</div>
            <span>Анкет</span>
        </div>

        <div class="line active-line"></div>

        <div class="step done-step">
            <div class="circle done">✓</div>
            <span>Багш</span>
        </div>

        <div class="line active-line"></div>

        <div class="step done-step">
            <div class="circle done">✓</div>
            <span>Хуваарь</span>
        </div>

        <div class="line active-line"></div>

        <div class="step active-step">
            <div class="circle active">5</div>
            <span>Төлбөр</span>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle">6</div>
            <span>Дууссан</span>
        </div>

    </section>

    <!-- TITLE -->

    <section class="title">
        <h1>Төлбөр</h1>
        <p>Төлбөрийн хэлбэрээ сонгоно уу</p>
    </section>

    <!-- PAYMENT -->

    <section class="payment-grid">

        <!-- LEFT CARD -->

        <div class="payment-card">

            <h2>Захиалгын дэлгэрэнгүй</h2>

            <div class="info-row">
                <span>Хөтөлбөр</span>
                <strong id="order-program">—</strong>
            </div>

            <div class="info-row">
                <span>Багц</span>
                <strong id="order-package">—</strong>
            </div>

            <div class="info-row" id="order-teacher-row" hidden>
                <span>Багш</span>
                <strong id="order-teacher">—</strong>
            </div>

            <div class="info-row" id="order-schedule-row" hidden>
                <span>Хуваарь</span>
                <strong id="order-schedule">—</strong>
            </div>

            <hr>

            <div class="total-row">
                <span>Нийт дүн</span>
                <strong id="order-amount">—</strong>
            </div>

        </div>

        <!-- RIGHT CARD -->

        <div class="payment-card qr-card">

            <div class="method-tabs">
                <button type="button" class="method-tab active" data-method="qpay">QPay (QR)</button>
                <button type="button" class="method-tab" data-method="bank">Дансаар</button>
            </div>

            <div id="method-qpay">
                <div class="qr-box" id="qr-box">QR</div>
                <p>QPay аппликейшнээр QR кодыг уншуулна уу</p>
                <button type="button" id="btn-get-qr">QR код авах</button>
                <button type="button" id="btn-check-payment" hidden>Төлбөр шалгах</button>
            </div>

            <div id="method-bank" hidden>
                <div class="bank-info" id="bank-info"></div>
                <button type="button" id="btn-confirm-bank">Шилжүүлсэн</button>
            </div>

            <p id="payment-status" hidden></p>

        </div>

    </section>
    <nav class="actions" aria-label="Алхам удирдлага">
        <button class="prev" type="button"><a href="schedule-select.html">Өмнөх</a></button>
        <button class="next" type="button"><a href="payment-success.html" id="next-link" class="is-disabled">Дараах</a></button>
    </nav>
</main>

<script type="module" src="../assets/js/pages/payment.js"></script>
</body>
</html>
